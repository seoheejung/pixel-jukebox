name: Deploy web demo and player bridge

on:
  push:
    branches: [main]
    paths:
      - player-bridge/**
      - release/**
      - .github/workflows/deploy-player-bridge.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify Pages bundle
        run: |
          test -f player-bridge/index.html
          test -f player-bridge/demo.css
          test -f player-bridge/demo.js
          test -f player-bridge/player.html
          test -f player-bridge/player.css
          test -f player-bridge/player.js
          compgen -G 'release/PixelJukebox-Setup-*.exe' > /dev/null
          test -f release/SHA256SUMS.txt
      - name: Prepare Pages bundle
        run: |
          mkdir pages-bundle
          cp -R player-bridge/. pages-bundle/
          cp release/PixelJukebox-Setup-*.exe pages-bundle/
          cp release/SHA256SUMS.txt pages-bundle/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-bundle
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
