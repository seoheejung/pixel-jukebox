<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Jukebox</title>
  </head>
  <body>
    <main>
      <header><h1>PIXEL JUKEBOX</h1><p>YOUTUBE MUSIC PLAYER</p></header>
      <section class="pixel-panel link-panel" aria-labelledby="link-title">
        <h2 id="link-title">ADD YOUTUBE VIDEO</h2>
        <label for="video-url">YOUTUBE LINK</label>
        <div class="video-link-row"><input id="video-url" type="url" autocomplete="off" spellcheck="false" placeholder="Paste a YouTube link" /><button id="add-video" type="button">ADD &amp; PLAY</button></div>
        <p id="video-message" role="status" aria-live="polite"></p>
      </section>
      <section id="player" class="pixel-panel" aria-label="YouTube Player Bridge"></section>
      <section class="pixel-panel" aria-labelledby="playlist-title">
        <h2 id="playlist-title">PLAYLIST</h2>
        <p id="playlist-empty">Playlist is empty. Paste a YouTube link above.</p>
        <div id="playlist-list" class="playlist-list" role="list"></div>
      </section>
      <details class="secondary-tools">
        <summary>PLAYER TOOLS</summary>
        <section class="pixel-panel" aria-labelledby="design-title">
          <h2 id="design-title">DESIGN</h2>
          <div class="design-grid">
            <label>DISC <select id="disc-style"><option value="lp">LP</option><option value="cd">CD</option></select></label>
            <label>BACKGROUND <input id="background" type="color" value="#fff4d8" /></label>
            <label>ACCENT <input id="accent" type="color" value="#ff6a3d" /></label>
          </div>
          <p class="design-preview">PREVIEW UPDATES IMMEDIATELY</p>
          <button id="save-design" type="button">SAVE</button>
        </section>
        <button id="open-pip" type="button" disabled>OPEN PIP</button>
      </details>
      <section class="pixel-panel" aria-labelledby="ai-title">
        <h2 id="ai-title">AI PICKS</h2>
        <button id="ai-picks" type="button" disabled>AI PICKS</button>
        <p id="ai-picks-message" role="status" aria-live="polite"></p>
        <div id="ai-picks-list" class="ai-picks-list"></div>
        <details class="ai-settings">
          <summary>OPENAI SETTINGS</summary>
          <label for="ai-key">API KEY</label>
          <input id="ai-key" type="password" autocomplete="off" spellcheck="false" />
          <button id="ai-connect" type="button">CONNECT</button>
          <p id="ai-message" role="status" aria-live="polite"></p>
        </details>
      </section>
    </main>
    <script type="module" src="/src/sidepanel/index.ts"></script>
  </body>
</html>
