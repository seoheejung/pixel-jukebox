<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://www.youtube.com; style-src 'self'; frame-src https://www.youtube.com; connect-src https://www.youtube.com; base-uri 'none'; form-action 'none'"
    />
    <title>Pixel Jukebox Player Bridge</title>
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
    <div id="youtube-player"></div>
    <script src="./player.js"></script>
    <script src="https://www.youtube.com/iframe_api" referrerpolicy="strict-origin-when-cross-origin"></script>
  </body>
</html>
